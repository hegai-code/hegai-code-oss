<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content` makes the software keyboard shrink
         the LAYOUT viewport, not just the visual one. Without it the shell keeps
         its full height behind the keyboard: the composer's send button and the
         mobile tab bar render underneath it, and `body{overflow:hidden}` means
         there is no way to scroll to them. Chrome/Android and Safari 26+ honour
         this; older iOS Safari needs useVisualViewport() in appHooks.ts. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Pre-JS defaults only. The script below replaces these with ONE resolved
         value — see the note there. Kept so a paint that somehow beats the
         script still gets a sane colour rather than white. -->
    <meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181a1b" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- Safari turns anything that looks like a phone number into a blue link.
         This app is full of ids, ports, durations and byte counts. -->
    <meta name="format-detection" content="telephone=no" />
    <title>Hegai Code</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable, and there IS a service worker — web/public/sw.js. The note
         that stood here said the opposite; it predated the worker by a month and
         was false from the day the worker landed, which cost 21.09.2026 several
         hours: three deploys were reported as «не доехало» while this comment
         kept the worker off the list of suspects.
         WHAT IT BUYS: a cold start on a phone whose radio has not come up paints
         the app instead of the browser's error page. In a standalone iOS window
         that page has no address bar, no reload and no way out.
         WHAT IT COSTS, and the cost is why sw.js is 300 lines and not 20: a
         cached document in front of a live control plane can be an OLD BUILD
         talking to a newer hub. Three things make that survivable, and removing
         any one of them brings back that day, when one bad wake-up pinned
         somebody to a three-hour-old build. (1) The browser protocol is
         capability-negotiated, not versioned — shared/src/web-protocol.ts: a
         client that never sends `caps` keeps getting whole snapshots, and an
         unknown message is ignored rather than fatal. (2) Navigations are
         network-first; the cache is a 3.5 s timeout fallback, never an answer.
         (3) A page handed that fallback is TOLD so and reloads itself
         (buildWatch.ts) — nobody has to find a button.
         The worker can be retired from the server in one deploy: see the kill
         switch described at the top of sw.js. That exit is the reason it is
         allowed here at all. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- PNG, not the SVG this used to point at: iOS silently ignores an SVG
         here and falls back to a SCREENSHOT of the page, so "Add to Home
         Screen" produced a thumbnail of whatever happened to be on screen
         instead of the mark. Generated by `npm run icons`. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hegai" />
    <!-- `default`, and this is the END of a day spent learning why.
         MEASURED on the device (the probe behind «Замер вёрстки»), iPhone
         430×932: with `black-translucent` the window is 873 tall and sits at
         y=0 — `inner 430×873`, every container filling it exactly. It does NOT
         grow into the strip it took from the top. Content placed past 873 is
         not painted at all; pushing the composer there made it vanish, which
         is the proof, not a theory.
         So `black-translucent` does not remove the 59pt band. It MOVES it —
         from above the clock, where a band is just a status bar, to below the
         composer, where it is a hole. There is no third option: the web view
         is 873 either way, and the only choice is which end of the screen the
         difference sits at.
         Under `default` that strip is painted by the system in the page's own
         background, so the way to make it disappear is to stop CONTRASTING
         with it — see `.ws-head` in styles.css, which had been given a white
         background for the opposite theory and is the reason the band read as
         a seam. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Set the theme before first paint so there's no light/dark flash on load.
         Default is light; 'system' resolves against the OS. Persists to
         localStorage('cc-theme'). -->
    <script>
      (function () {
        var p = localStorage.getItem('cc-theme') || 'light';
        var t = p === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : (p === 'dark' || p === 'vscode' ? p : 'light');
        document.documentElement.dataset.theme = t;
        // The two media-gated theme-colors above answer to the OS, and the app's
        // theme answers to localStorage. Pick dark inside a light system and the
        // standalone window kept an ivory status bar over a near-black app — a
        // seam across the top that reads as a broken chrome, not a choice. A
        // browser uses the FIRST theme-color whose media matches, so the media
        // ones are removed outright and one resolved value put in their place;
        // keeping them and appending would leave the OS answer winning.
        //
        // --surface, NOT --bg. In a standalone iOS window this colour paints the
        // status-bar strip, and what sits directly beneath that strip is never
        // the canvas: it is the top bar (`.topbar`, --surface at 72%) or, with
        // the drawer open, the drawer itself (--surface, opaque). Against
        // --bg's #f6f7f6 that left a grey band across the top of every screen
        // — a seam that reads as broken chrome, which is exactly what the
        // paragraph above set out to remove and got half right. Scrolled
        // content never reaches y=0 to disagree: the bar overlays it.
        // Dark was ALSO drifting — #0a0e0c against a --bg of #0b0c0d, close
        // enough to look like a rendering artefact and not a typo.
        // --bg, the CANVAS, not --surface. In an iOS standalone window this
        // colour is what the system paints in the strip the web view does not
        // occupy, and measurement settled where that strip is: with
        // `black-translucent` the window starts at y=0 but keeps the safe-area
        // HEIGHT (873 of a 932pt screen), so the leftover 59pt sit at the
        // BOTTOM, under the composer — which is drawn on --bg. Matching it is
        // all that can be done: the web view genuinely ends there, and content
        // placed below 873 is not painted at all (proven by pushing the
        // composer into it and watching it vanish). Must track --bg.
        var bg = t === 'dark' ? '#181a1b' : t === 'vscode' ? '#fdf6e3' : '#f6f7f6';
        var old = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < old.length; i++) old[i].remove();
        var m = document.createElement('meta');
        m.name = 'theme-color';
        m.content = bg;
        document.head.appendChild(m);
      })();
    </script>
    <!-- No web fonts: the UI uses the system faces (Segoe UI / SF / Roboto),
         as Codex and Claude do — see --sans in styles.css and DESIGN.md. -->
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
