# Hegai Code — self-hosted hub: the hub itself and Caddy for automatic HTTPS.
#
#   cd deploy/selfhost && ./init.sh && docker compose up -d --build
#
# Everything is configured through .env (see .env.example); the one volume,
# hub-data, holds ALL state. Logs go to stdout (docker compose logs).
name: ${COMPOSE_PROJECT_NAME:-hegai-code}

services:
  hub:
    build:
      context: ../..
      dockerfile: deploy/selfhost/Dockerfile
    image: ${HEGAI_HUB_IMAGE:-hegai-code-hub:local}
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed by the packaging, not a choice: the image defaults repeated so a
      # stray line in .env cannot move the database off the volume.
      CC_REMOTE_EDITION: external
      HOST: 0.0.0.0
      PORT: "4319"
      CC_REMOTE_DB_PATH: /data/cc-remote.sqlite3
      CC_REMOTE_DATA_DIR: /data
      WEB_DIST: /app/web-dist
      CC_REMOTE_PUBLIC_URL: https://${HEGAI_DOMAIN:?set HEGAI_DOMAIN in .env}
      # Caddy is the only peer on this network; the hub believes its X-Real-IP.
      # (The LLM gateway, compose.llm.yml, stays off this network on purpose.)
      CC_REMOTE_TRUSTED_PROXIES: ${HEGAI_NET_SUBNET:-172.31.77.0/24}
      CC_REMOTE_TOKEN: ${CC_REMOTE_TOKEN:?set CC_REMOTE_TOKEN in .env (run ./init.sh)}
      CC_REMOTE_BOOTSTRAP_EMAIL: ${CC_REMOTE_BOOTSTRAP_EMAIL:?set CC_REMOTE_BOOTSTRAP_EMAIL in .env}
      CC_REMOTE_HOST_ENROLLMENT_SECRET: ${CC_REMOTE_HOST_ENROLLMENT_SECRET:-}
    volumes:
      - hub-data:/data
    # Optional: the operator's own privacy / support / deletion pages
    # (privacy.html, support.html, delete-account.html), see .env.example.
    #   - ./legal:/legal:ro      (and CC_REMOTE_LEGAL_DIR=/legal)
    networks: [edge]
    expose: ["4319"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${HEGAI_HUB_MEM:-2g}
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4319/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2@sha256:36c24ad91a7ff7bc4c87fe22bfa8df3c4b18da0773d73fc12ee2c52b98c0bb7e
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      HEGAI_DOMAIN: ${HEGAI_DOMAIN:?set HEGAI_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m

networks:
  edge:
    ipam:
      config:
        # Must match CC_REMOTE_TRUSTED_PROXIES above; change both together
        # (HEGAI_NET_SUBNET) if this range is taken on your host.
        - subnet: ${HEGAI_NET_SUBNET:-172.31.77.0/24}

volumes:
  hub-data:
  caddy-data:
  caddy-config:
