<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hegai Code — сервер</title>
    <style>
      :root {
        --bg: #fcfaf1; --surface: #fffdf7; --text: #101f18; --text-faint: #5c6b63;
        --attn: #ff6a3d; --accent: #101f18; --on-accent: #fcfaf1;
        --field: #f2efe4; --shadow-xs: 0 2px 8px rgba(16, 31, 24, 0.05);
        --radius-panel: 16px;
        --sans: "Onest", "Segoe UI", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0e0c; --surface: #101f18; --text: #f2efe4; --text-faint: #9aa89f;
          --accent: #f2efe4; --on-accent: #0a0e0c; --field: #0a0e0c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
        background: var(--bg); color: var(--text);
        font-family: var(--sans); font-size: 14px; line-height: 1.5;
      }
      .card {
        width: 100%; max-width: 440px; padding: 24px;
        background: var(--surface); border-radius: var(--radius-panel); box-shadow: var(--shadow-xs);
      }
      h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
      p { margin: 0 0 14px; color: var(--text-faint); }
      input {
        width: 100%; padding: 10px 12px; border: 0; border-radius: 10px;
        background: var(--field); color: var(--text); font: inherit;
      }
      .err { min-height: 20px; margin: 6px 0 10px; color: var(--attn); font-size: 13px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      button {
        padding: 9px 14px; border: 0; border-radius: 10px; cursor: pointer;
        font: inherit; font-weight: 500; background: var(--field); color: var(--text);
      }
      button.primary { background: var(--accent); color: var(--on-accent); }
      button:disabled { opacity: 0.5; cursor: default; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Сервер</h1>
      <p>Адрес вашего Hegai Code. Приложение перезапустится.</p>
      <input id="url" type="text" spellcheck="false" autocomplete="off" />
      <div id="err" class="err" role="alert"></div>
      <div class="row">
        <button id="save" class="primary">Сохранить и перезапустить</button>
        <button id="reset">Сбросить на code.acme.test</button>
      </div>
    </main>
    <script src="server.js"></script>
  </body>
</html>
